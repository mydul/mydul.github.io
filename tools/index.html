<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tools — Mydul Islam</title><meta name="description" content="Small interactive tools: THz converter, Bragg's law, PERT estimator."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>M</text></svg>"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/site.css"></head><body data-root="../"><main class="wrap">
<p class=kicker>Playground</p><h1>Small <em>tools</em></h1>
<p class=lead>Handy calculators from my two worlds: nanotech and project management.</p>
<div class=grid>
<div class=card><h3>Frequency · wavelength · energy</h3>
<label>I know the…</label><select id=fk><option value=f>Frequency (THz)</option><option value=w>Wavelength (µm)</option><option value=e>Photon energy (meV)</option></select>
<label>Value</label><input id=fv type=number step=any value=1><div class=out id=fo></div></div>
<div class=card><h3>Bragg's law</h3>
<label>Order n</label><input id=bn type=number value=1 min=1>
<label>Wavelength λ (Å)</label><input id=bl type=number step=any value=1.5406>
<label>Plane spacing d (Å)</label><input id=bd type=number step=any value=3><div class=out id=bo></div></div>
<div class=card><h3>PERT estimate</h3>
<label>Optimistic (days)</label><input id=po type=number step=any value=4>
<label>Most likely (days)</label><input id=pm type=number step=any value=6>
<label>Pessimistic (days)</label><input id=pp type=number step=any value=14><div class=out id=po2></div></div>
</div>
<script>
const $=i=>document.getElementById(i),n=i=>+$(i).value;
function conv(){const v=n('fv'),k=$('fk').value,f=k=='f'?v:k=='w'?299.792458/v:v/4.135667696;
$('fo').innerHTML=f>0&&isFinite(f)?`Frequency <b>${f.toPrecision(5)} THz</b><br>Wavelength <b>${(299.792458/f).toPrecision(5)} µm</b><br>Photon energy <b>${(4.135667696*f).toPrecision(5)} meV</b>`:'Enter a positive value.';}
function bragg(){const s=n('bn')*n('bl')/(2*n('bd')),t=Math.asin(s)*180/Math.PI;
$('bo').innerHTML=s>0&&s<=1?`θ <b>${t.toFixed(3)}°</b><br>2θ <b>${(2*t).toFixed(3)}°</b>`:'No diffraction for these values (nλ/2d must be between 0 and 1).';}
function pert(){const o=n('po'),m=n('pm'),p=n('pp');
$('po2').innerHTML=p>=m&&m>=o?`Expected <b>${((o+4*m+p)/6).toFixed(1)} days</b><br>Std. deviation <b>${((p-o)/6).toFixed(1)} days</b>`:'Needs optimistic ≤ most likely ≤ pessimistic.';}
[['fv','fk'],['bn','bl','bd'],['po','pm','pp']].forEach((g,i)=>g.forEach(x=>$(x).addEventListener('input',[conv,bragg,pert][i])));
document.getElementById('fk').addEventListener('change',conv);conv();bragg();pert();
</script>
</main><script src="../assets/js/site.js"></script></body></html>

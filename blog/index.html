<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog — Mydul Islam</title><meta name="description" content="Notes on R&D project management, nanotechnology and Bengali writing."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>M</text></svg>"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/site.css"><style>.card h3{font-family:'Hind Siliguri','Fraunces',serif}.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:44px}.pg{min-width:44px;height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;background:#f2ece3;font-weight:700;transition:.2s}.pg:hover{background:#f8c43c}.pg.on{background:#16162a;color:#fff}.pg.off{opacity:.35;pointer-events:none}.gap{color:#8d8a9c;padding:0 4px}.pinfo{text-align:center;color:#8d8a9c;font-size:14px;margin-top:16px}</style></head><body data-root="../"><main class="wrap"><p class=kicker>Writing</p><h1>The <span class=hl>blog</span></h1><p class=lead id=lead></p><div class=grid id=list></div><nav class=pager id=pager aria-label="Pagination"></nav><p class=pinfo id=pinfo></p></main>
<script src="posts.js"></script>
<script>
const PER=8,pages=Math.ceil(POSTS.length/PER),q=+new URLSearchParams(location.search).get('page')||1,p=Math.min(Math.max(q,1),pages),$=i=>document.getElementById(i),L=n=>'?page='+n;
$('lead').textContent=POSTS.length+' posts on Project Management, Nanotech, Technology, Bengali writing and many more.';
$('list').innerHTML=POSTS.slice((p-1)*PER,p*PER).map(x=>`<a class=card href="${x.u}"><span class=meta>${x.d}</span><h3>${x.t}</h3>${x.x?`<p>${x.x}…</p>`:''}${(x.c||[]).map(c=>`<span class=tag>${c}</span>`).join('')}</a>`).join('');
let h=`<a class="pg${p==1?' off':''}" href="${L(p-1)}">← Prev</a>`,last=0;
for(let i=1;i<=pages;i++)if(i==1||i==pages||Math.abs(i-p)<=1){if(i-last>1)h+='<span class=gap>…</span>';h+=`<a class="pg${i==p?' on':''}" href="${L(i)}">${i}</a>`;last=i}
h+=`<a class="pg${p==pages?' off':''}" href="${L(p+1)}">Next →</a>`;
$('pager').innerHTML=h;$('pinfo').textContent='Page '+p+' of '+pages;document.title='Blog (page '+p+') — Mydul Islam';
</script><script src="../assets/js/site.js"></script></body></html>

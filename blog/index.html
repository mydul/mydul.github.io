<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog — Mydul Islam</title><meta name="description" content="Notes on R&D project management, nanotechnology and Bengali writing."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>M</text></svg>"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/site.css"><style>.card h3{font-family:'Hind Siliguri','Fraunces',serif}.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:44px}.pg{min-width:44px;height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;background:#f2ece3;font-weight:700;transition:.2s}.pg:hover{background:#f8c43c}.pg.on{background:#16162a;color:#fff}.pg.off{opacity:.35;pointer-events:none}.gap{color:#8d8a9c;padding:0 4px}.pinfo{text-align:center;color:#8d8a9c;font-size:14px;margin-top:16px}.sb{position:relative;max-width:640px;margin:28px 0 18px}.sb input{width:100%;height:56px;border-radius:99px;border:2px solid var(--line,#e8e0d4);background:var(--card,#fff);color:var(--ink,#16162a);padding:0 52px 0 54px;font:500 17px 'Hind Siliguri','DM Sans',sans-serif;outline:0;transition:.2s}.sb input:focus{border-color:#f8c43c;box-shadow:0 0 0 4px rgba(248,196,60,.25)}.sb .ic{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.55;pointer-events:none}.sb button{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:#f2ece3;cursor:pointer;font-size:16px;display:none}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{border:0;cursor:pointer;padding:8px 16px;border-radius:99px;background:#f2ece3;color:#16162a;font:600 14px 'Hind Siliguri','DM Sans',sans-serif;transition:.2s}.chip:hover{background:#f8c43c}.chip.on{background:#16162a;color:#fff}.chip i{font-style:normal;opacity:.6;margin-left:6px;font-size:12px}.rc{color:#8d8a9c;font-size:14px;margin:6px 0 24px}.none{padding:40px 0;color:#8d8a9c}html[data-theme=dark] .sb input{background:#1e1d2b;border-color:#34324a;color:#eee}html[data-theme=dark] .chip,html[data-theme=dark] .sb button{background:#26253a;color:#eee}html[data-theme=dark] .chip.on{background:#f8c43c;color:#16162a}</style></head><body data-root="../"><main class="wrap"><p class=kicker>Writing</p><h1>The <span class=hl>blog</span></h1><p class=lead id=lead></p><div class=sb><span class=ic>🔍</span><input id=q type=search placeholder="Search posts… বাংলা বা English" autocomplete=off aria-label="Search posts"><button id=x aria-label="Clear">✕</button></div><div class=chips id=chips></div><p class=rc id=rc></p><div class=grid id=list></div><nav class=pager id=pager aria-label="Pagination"></nav><p class=pinfo id=pinfo></p></main>
<script src="posts.js"></script>
<script>
const PER=6,$=i=>document.getElementById(i),U=new URLSearchParams(location.search);
const dec=t=>{const e=document.createElement('textarea');e.innerHTML=t;return e.value};
const norm=t=>dec(t||'').normalize('NFC').toLowerCase();
POSTS.forEach(x=>x._s=norm(x.t+' '+(x.x||'')+' '+(x.c||[]).join(' ')));
let Q=U.get('q')||'',C=U.get('cat')||'',P=+U.get('page')||1;
const cats={};POSTS.forEach(x=>(x.c||[]).forEach(c=>cats[c]=(cats[c]||0)+1));
const esc=t=>t.replace(/"/g,'&quot;');
function url(){const u=new URLSearchParams();if(Q)u.set('q',Q);if(C)u.set('cat',C);if(P>1)u.set('page',P);const s=u.toString();history.replaceState(null,'',s?'?'+s:location.pathname)}
function chips(){$('chips').innerHTML=`<button class="chip${C?'':' on'}" data-c="">All<i>${POSTS.length}</i></button>`+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="chip${C==c?' on':''}" data-c="${esc(c)}">${c}<i>${n}</i></button>`).join('')}
function render(){
 const q=norm(Q).trim(),words=q.split(/\s+/).filter(Boolean);
 const R=POSTS.filter(x=>(!C||(x.c||[]).includes(C))&&words.every(w=>x._s.includes(w)));
 const pages=Math.max(1,Math.ceil(R.length/PER));P=Math.min(Math.max(P,1),pages);
 $('rc').textContent=(Q||C)?R.length+' result'+(R.length==1?'':'s')+(C?' in “'+C+'”':'')+(Q?' for “'+Q+'”':''):POSTS.length+' posts on project management, nanotech and Bengali writing.';
 $('lead').textContent='';
 $('list').innerHTML=R.length?R.slice((P-1)*PER,P*PER).map(x=>`<a class=card href="${x.u}"><span class=meta>${x.d}</span><h3>${x.t}</h3>${x.x?`<p>${x.x}…</p>`:''}${(x.c||[]).map(c=>`<span class=tag>${c}</span>`).join('')}</a>`).join(''):'<p class=none>No posts found. Try another word or category.</p>';
 let h='',last=0;
 if(pages>1){h=`<a class="pg${P==1?' off':''}" href="#" data-p="${P-1}">← Prev</a>`;
  for(let i=1;i<=pages;i++)if(i==1||i==pages||Math.abs(i-P)<=1){if(i-last>1)h+='<span class=gap>…</span>';h+=`<a class="pg${i==P?' on':''}" href="#" data-p="${i}">${i}</a>`;last=i}
  h+=`<a class="pg${P==pages?' off':''}" href="#" data-p="${P+1}">Next →</a>`}
 $('pager').innerHTML=h;$('pinfo').textContent=pages>1?'Page '+P+' of '+pages:'';
 $('x').style.display=Q?'block':'none';chips();url();
 document.title='Blog'+(P>1?' (page '+P+')':'')+' — Mydul Islam'}
$('q').value=Q;
$('q').addEventListener('input',e=>{Q=e.target.value;P=1;render()});
$('x').onclick=()=>{Q='';$('q').value='';P=1;render();$('q').focus()};
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;C=b.dataset.c;P=1;render()});
$('pager').addEventListener('click',e=>{const a=e.target.closest('.pg');if(!a)return;e.preventDefault();if(a.classList.contains('off'))return;P=+a.dataset.p;render();scrollTo({top:0,behavior:'smooth'})});
render();
</script><script src="../assets/js/site.js"></script></body></html>
